name: Update profile statistics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Comma-separated, case-insensitive identities used for the approximate LOC count.
      GIT_AUTHOR_NAMES: "Saad Hassan"
      GIT_AUTHOR_EMAILS: "replace-with-my-github-emails"
      LOC_MAX_REPOS: "50"
      LOC_CLONE_DEPTH: "500"
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate profile SVGs
        run: node scripts/generate-profile.js

      - name: Commit changed SVGs
        run: |
          if git diff --quiet -- assets/profile-light.svg assets/profile-dark.svg; then
            echo "Profile SVGs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-light.svg assets/profile-dark.svg
          git commit -m "chore: update profile statistics"
          git push
